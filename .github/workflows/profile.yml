name: Profil

on:
  push:
    branches: [main]
    paths: ["scripts/**"]
  schedule:
    - cron: "17 6 * * *"   # stats tous les jours ~08h (Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cartes (hero, projets, footer)
        run: python scripts/build_cards.py
      - name: Stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "profil: mise à jour des cartes"
          git push
